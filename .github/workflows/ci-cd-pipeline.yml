name: Warehouse Management System CI

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: 17
  MAVEN_OPTS: -Xmx1024m

jobs:

  # -----------------------------------
  # Code Quality (Non-Blocking)
  # -----------------------------------
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # Generate report but DO NOT fail build
      - name: Run Checkstyle (Non-blocking)
        run: ./mvnw checkstyle:checkstyle -Dcheckstyle.failOnViolation=false

      - name: Run SpotBugs (Non-blocking)
        run: ./mvnw spotbugs:spotbugs || true

      - name: Run OWASP Dependency Check (Non-blocking)
        run: ./mvnw org.owasp:dependency-check-maven:check || true

  # -----------------------------------
  # Build & Test
  # -----------------------------------
  build-test:
    runs-on: ubuntu-latest
    needs: code-quality

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: warehouse_test
        ports:
          - 5432:5432

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # Simple wait loop (no pg_isready, no extra tools)
      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            (echo > /dev/tcp/localhost/5432) >/dev/null 2>&1 && break
            sleep 2
          done

      - name: Run Tests (Unit + Integration)
        run: ./mvnw clean verify -Pintegration-tests
        env:
          QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5432/warehouse_test
          QUARKUS_DATASOURCE_USERNAME: postgres
          QUARKUS_DATASOURCE_PASSWORD: postgres

      - name: Generate JaCoCo Report
        run: ./mvnw jacoco:report

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

  # -----------------------------------
  # Sec
