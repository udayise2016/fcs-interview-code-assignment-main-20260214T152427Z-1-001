# Test configuration for Quarkus
quarkus.test.profile=test

# Database configuration for tests (Quarkus 1.3+ format)
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=MySQL
quarkus.datasource.jdbc.driver=org.h2.Driver
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.health.enabled=false

# Hibernate configuration
quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=no-file

# Disable unnecessary features for tests
quarkus.log.level=ERROR
quarkus.log.console.enable=false
quarkus.log.file.enable=false

# Test specific settings
quarkus.http.test-port=0
quarkus.http.host=0.0.0.0
